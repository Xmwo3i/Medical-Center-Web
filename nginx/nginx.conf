worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Buffers ────────────────────────────────────────────────────────────────
    client_body_buffer_size    128k;
    client_max_body_size        20m;
    client_header_buffer_size    1k;
    large_client_header_buffers 4 8k;
    output_buffers              1 32k;
    postpone_output             1460;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml
        application/xml
        font/woff2;

    # ── Upstream: PHP/Apache backend ───────────────────────────────────────────
    upstream backend_pool {
        server backend:80;
        keepalive 32;
    }

    # ── Upstream: Vite dev server ──────────────────────────────────────────────
    upstream frontend_pool {
        server frontend:3000;
        keepalive 16;
    }

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time s - $status "$request" $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Server ─────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── API → PHP backend (direct, no Vite hop) ──────────────────────────
        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection    "";
            proxy_set_header   Host          $host;
            proxy_set_header   X-Real-IP     $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;

            proxy_buffer_size      16k;
            proxy_buffers          8 16k;
            proxy_busy_buffers_size 32k;

            # Allow CORS preflight through
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                return 204;
            }
        }

        # ── Uploads (static files served by backend) ─────────────────────────
        location /uploads/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            # Cache uploaded images/files for 1 day
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # ── Vite HMR WebSocket ───────────────────────────────────────────────
        location ~ ^/(@vite|@react-refresh|__vite_hmr) {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }

        # ── Frontend (Vite dev server) ────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $http_connection;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;

            proxy_connect_timeout 10s;
            proxy_read_timeout    3600s;

            # Cache static assets served by Vite
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
                proxy_pass http://frontend_pool;
                add_header Cache-Control "public, max-age=3600";
            }
        }
    }
}
