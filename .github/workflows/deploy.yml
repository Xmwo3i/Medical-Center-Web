name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ── Step 1: Get the code ──────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Setup Node.js for React build ─────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Step 3: Install frontend dependencies ─────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # ── Step 4: Build React for production ────────────────────
      - name: Build React
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}

      # ── Step 5: Copy React build to EC2 ──────────────────────
      - name: Copy React build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/dist/*"
          target: "/home/ec2-user/new_build"
          strip_components: 2

      # ── Step 6: Copy backend to EC2 ──────────────────────────
      - name: Copy backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "backend/*"
          target: "/home/ec2-user/new_backend"
          strip_components: 1

      # ── Step 7: Deploy on EC2 ─────────────────────────────────
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Deploy React build
            sudo cp -r /home/ec2-user/new_build/* /var/www/html/

            # Deploy backend (preserve .env file)
            sudo rsync -av --exclude='.env' /home/ec2-user/new_backend/ /var/www/backend/

            # Fix permissions
            sudo chown -R apache:apache /var/www/html
            sudo chown -R apache:apache /var/www/backend
            sudo chmod -R 755 /var/www/html
            sudo chmod -R 755 /var/www/backend
            sudo chmod -R 777 /var/www/backend/uploads

            # Clean up temp folders
            rm -rf /home/ec2-user/new_build
            rm -rf /home/ec2-user/new_backend

            # Restart Apache
            sudo systemctl restart httpd

            echo "🚀 Deployment complete!"